name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The CRX's extension ID derives from this key, so CI must sign with the
      # same tabrunner-test.pem used locally — stored here as a repo secret.
      - name: Restore CRX signing key
        env:
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
        run: |
          if [ -z "$CRX_SIGNING_KEY" ]; then
            echo "✗ CRX_SIGNING_KEY secret is empty — set it to the contents of tabrunner-test.pem." >&2
            exit 1
          fi
          printf '%s\n' "$CRX_SIGNING_KEY" > tabrunner-test.pem
      - run: bun run zip
      # crx.ts finds a Chromium binary on its own — google-chrome is preinstalled
      # on the ubuntu-latest runner image.
      - run: bun run crx
      # Versioned names are the permanent record; the `latest` aliases give
      # tabrunner.app stable hotlinks (`releases/latest/download/<alias>`) that
      # never need a site deploy when a version ships.
      - name: Stable download aliases for tabrunner.app
        run: |
          cp dist/tabrunner-*-chrome.zip dist/tabrunner-latest-chrome.zip
          cp dist/tabrunner-*.crx dist/tabrunner-latest.crx
      # Permanent record of the version's artifacts — public download links on
      # the tagged GitHub Release, with auto-generated notes. The CWS dashboard
      # itself never exposes a shareable artifact, so this is the storage seam.
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tabrunner-*.zip
            dist/tabrunner-*.crx
          generate_release_notes: true
